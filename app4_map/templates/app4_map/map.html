<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="origin-when-cross-origin">
    <title>Карта в Django</title>
    <script src="https://api-maps.yandex.ru/v3/?apikey=fcff3592-2cc9-442e-ba8d-9fb3386b4d6f&lang=ru_RU"></script>
</head>
<body>
    <div>
        <nav><a href="{% url 'main:reload_index' %}">На главную</a></nav>
        <hr>
    </div>

    <h2>Карта компаний</h2>

    Перейдите по ссылке: <a href="{{ external_url }}">на внешний сайт</a>
    <ul>
    {% for company_id, company in result.items %}
        <li>{{ company.name }} по адресу {{ company.address }}</li>
    {% endfor %}
    </ul>

    <div id="map" style="width: 90%; height: 600px; border: 1px solid black;"></div>

    <script>
        async function initMap() {
            const mapData = JSON.parse('{{ result_json|escapejs }}');

            await ymaps3.ready;
            const {YMap, YMapDefaultSchemeLayer, YMapMarker, YMapDefaultFeaturesLayer} = ymaps3;

            const map = new YMap(
                document.getElementById('map'),
                { location: { center: [37.6173, 55.7558], zoom: 10 } }
            );

            map.addChild(new YMapDefaultSchemeLayer());
            map.addChild(new YMapDefaultFeaturesLayer());

            for (const company of Object.values(mapData)) {
                if (company.address) {
                    const response = await fetch(
                        `https://geocode-maps.yandex.ru/1.x/?format=json&apikey=fcff3592-2cc9-442e-ba8d-9fb3386b4d6f&geocode=${encodeURIComponent(company.address)}`
                    );
                    const data = await response.json();
                    const found = data.response.GeoObjectCollection.featureMember;

                    if (found && found.length > 0) {
                        const pos = found[0].GeoObject.Point.pos;
                        const [lon, lat] = pos.split(' ').map(Number);

                        const markerElement = document.createElement('div');
                        markerElement.innerHTML = '📍';
                        markerElement.style.fontSize = '40px';
                        markerElement.style.transform = 'translate(-50%, -100%)';
                        markerElement.title = company.name;

                        const marker = new YMapMarker({ coordinates: [lon, lat] }, markerElement);
                        map.addChild(marker);
                    }
                }
            }
        }

        initMap();
    </script>


</body>
</html>
